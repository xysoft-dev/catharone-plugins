name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify retired package
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          for path in catharone .agents/plugins/marketplace.json .claude-plugin/marketplace.json; do
            test ! -e "$path"
          done
